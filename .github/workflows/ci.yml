name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      # Build/syntax/docs runs once on the primary Node version; the secondary
      # version runs the full test suite against the already-built bundle.
      - name: Build UI bundle
        if: matrix.node-version == 22
        run: npm run build:ui

      - name: Check JavaScript syntax & bundle
        if: matrix.node-version == 22
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Check production dependency audit
        run: npm audit --omit=dev

      - name: Build docs
        if: matrix.node-version == 22
        run: npm run docs:build
