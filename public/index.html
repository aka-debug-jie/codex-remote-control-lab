<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <meta name="color-scheme" content="dark light" />
    <title>Codex Remote</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#0e1116" />
    <style>
      /* Critical inline CSS: covers the first paint (background + shell
         skeleton) before the bundled stylesheet loads. Kept tiny; the real
         design system lives in styles/app.css. */
      :root {
        color-scheme: dark;
        --critical-surface: #0e1116;
        --critical-on: #e4e6ee;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --critical-surface: #fbfaff;
        --critical-on: #1b1b21;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--critical-surface);
        color: var(--critical-on);
        font-family: -apple-system, "Roboto", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        height: 100%;
      }
      .app-shell {
        height: 100%;
        background: var(--critical-surface);
      }
      .top-app-bar {
        min-height: 56px;
        background: var(--critical-surface);
      }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("codexPhoneTheme") || "system";
          if (pref !== "system" && pref !== "light" && pref !== "dark") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = pref;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/app-vgq-DFF3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-BtATNby8.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
