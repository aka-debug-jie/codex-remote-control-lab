<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <meta name="color-scheme" content="dark light" />
    <title>Codex Remote</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#0e1116" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("codexPhoneTheme") || "system";
          if (pref !== "system" && pref !== "light" && pref !== "dark") pref = "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.themePref = pref;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/app-C8j0q5TD.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-DmjmJLlb.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
